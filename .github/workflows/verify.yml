name: Verify scientific record
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Check out the actual source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up the reproduction interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned numerical packages
        run: python -m pip install -r requirements.txt
      - name: Verify sources and all scientific assertions
        run: python tools/verify.py --output-dir "$RUNNER_TEMP/dimer-verification" --allow-numeric-report-differences
      - name: Reproduce the preserved alternative estimate
        run: python tools/verify_alternative_time.py --output-dir "$RUNNER_TEMP/dimer-verification/alternative"
      - name: Attach the exact tracked sources to passing evidence
        run: git archive --format=tar --output="$RUNNER_TEMP/dimer-verification/source.tar" HEAD
      - name: Preserve complete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dimer-verification
          if-no-files-found: error
          retention-days: 30
